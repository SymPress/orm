name: QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    uses: sympress/workflows/.github/workflows/lint-workflows.yml@2ebe47e2bc6d402c172015b64c0f5a9f2bf0c322 # v1.3.2

  qa:
    uses: sympress/workflows/.github/workflows/sympress-qa.yml@2ebe47e2bc6d402c172015b64c0f5a9f2bf0c322 # v1.3.2
    with:
      php_version: '8.5'
    secrets:
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}
